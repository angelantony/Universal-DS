<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Universal DS vanilla demo</title>
  </head>
  <body>
    <uds-button id="label-button" variant="outline" tone="danger">Save</uds-button>
    <p id="count">0</p>
    <form id="demo-form">
      <input id="title" name="title" />
      <uds-button id="submit-button" type="submit">Submit</uds-button>
      <uds-button id="reset-button" type="reset">Reset</uds-button>
    </form>
    <p id="submitted">no</p>
    <uds-button id="disabled" disabled>Disabled</uds-button>
    <p id="disabled-count">0</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
